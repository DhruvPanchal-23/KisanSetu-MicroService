services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    build: .
    command: ["node", "gateway/main.js"]
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PORT: "8000"
      HOST: "0.0.0.0"
      AUTH_URL: http://auth-service:8000
      FARM_URL: http://farm-service:8000
      WEATHER_URL: http://weather-service:8000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    depends_on:
      auth-service:
        condition: service_healthy
      farm-service:
        condition: service_healthy
      weather-service:
        condition: service_healthy
    restart: unless-stopped

  auth-service:
    build: .
    command: ["node", "auth-service/main.js"]
    environment:
      PORT: "8000"
      HOST: "0.0.0.0"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env to a random secret of at least 32 characters}
      DATABASE_PATH: /app/storage/auth.db
      MONGODB_URI: ${MONGODB_URI:-}
      MONGODB_DB: ${MONGODB_DB:-kisansetu}
    volumes:
      - auth-data:/app/storage
    restart: unless-stopped

  farm-service:
    build: .
    command: ["node", "farm-service/main.js"]
    environment:
      PORT: "8000"
      HOST: "0.0.0.0"
      AUTH_URL: http://auth-service:8000
      DATABASE_PATH: /app/storage/farms.db
      MONGODB_URI: ${MONGODB_URI:-}
      MONGODB_DB: ${MONGODB_DB:-kisansetu}
    volumes:
      - farm-data:/app/storage
    depends_on:
      auth-service:
        condition: service_healthy
    restart: unless-stopped

  weather-service:
    build: .
    command: ["node", "weather-service/main.js"]
    environment:
      PORT: "8000"
      HOST: "0.0.0.0"
    restart: unless-stopped

  mongo-migrate:
    profiles: ["tools"]
    build: .
    command: ["node", "scripts/migrate-mongo.js"]
    environment:
      MONGODB_URI: ${MONGODB_URI:-}
      MONGODB_DB: ${MONGODB_DB:-kisansetu}
      AUTH_DATABASE_PATH: /source/auth/auth.db
      FARM_DATABASE_PATH: /source/farms/farms.db
    volumes:
      - auth-data:/source/auth:ro
      - farm-data:/source/farms:ro
    healthcheck:
      disable: true

volumes:
  auth-data:
  farm-data:
